<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course player</title><link rel="stylesheet" href="styles.css"><script src="scorm-runtime.js"></script></head><body class="player-body"><header class="player-bar"><a class="player-back" href="index.html#courses">← Portfolio</a><div class="player-title"><b id="title">Loading course…</b><small id="standard"></small></div><span class="player-status" id="status">Progress saves in this browser</span><button class="player-action" id="restart" type="button">Reset progress</button><a class="player-action" id="newWindow" target="course-demo-window">Open in new window</a><button class="player-action" id="fullscreen" type="button">Fullscreen</button></header><iframe class="player-frame" id="courseFrame" title="Interactive course"></iframe><script src="config.js"></script><script>
const id=new URLSearchParams(location.search).get('course'),c=PORTFOLIO_CONFIG.courses.find(x=>x.id===id),frame=document.querySelector('#courseFrame');if(c){document.title=c.title+' — Course player';document.querySelector('#title').textContent=c.title;document.querySelector('#standard').textContent=c.standard+' · Local progress enabled';frame.src=c.launch;document.querySelector('#newWindow').href=c.launch}else{frame.remove();document.body.insertAdjacentHTML('beforeend','<div class="player-error"><h1>Course not found</h1><p>This course ID is not present in config.js.</p></div>')}document.querySelector('#fullscreen').onclick=()=>{const el=document.querySelector('.player-body');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};document.querySelector('#restart').onclick=()=>{if(confirm('Clear saved position, completion and score for this course?')){SCORM_DEMO.clear();location.reload()}};window.addEventListener('scormchange',()=>{const s=SCORM_DEMO.get('cmi.core.lesson_status'),loc=SCORM_DEMO.get('cmi.core.lesson_location');document.querySelector('#status').textContent=(s&&s!=='not attempted'?s:'In progress')+(loc?' · bookmark saved':'')});
</script></body></html>
