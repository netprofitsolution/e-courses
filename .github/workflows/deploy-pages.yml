name: Deploy e-learning portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract and validate complete course website
        shell: bash
        run: |
          set -euo pipefail
          archive="github-pages-unzip-then-upload.zip"
          test -f "$archive"
          rm -rf _site
          mkdir _site
          unzip -q "$archive" -d _site
          test -f _site/index.html
          test -f _site/player.html
          test -f _site/courses/module-1/training.htm
          test -f _site/courses/module-2/training.htm
          test -f _site/courses/module-3/training.htm
          touch _site/.nojekyll

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
