        .text-carousel {
            font-family: 'Roboto Light', sans-serif;
            font-weight: 200; 
            position: relative;
            height: 60px;
            width: 100%;
            display: flex;
            flex-direction: column;

        .line {
            position: absolute;
            left: 0;
            transform: translateX(0);
            width: 100%;
            height: 20px;
            opacity: 0.33;
            transform-origin: left center;
            white-space: nowrap;
        }

        .line.top {
            transform: translate(0, -20px) scale(0.7);
            margin-bottom: -3px;
        }

        .line.middle {
            transform: translate(0, 0) scale(1);
            opacity: 1;
        }

        .line.bottom {
            transform: translate(0, 20px) scale(0.7);
        }

        /* Add animation class to trigger upward move */
        .text-carousel.animate .line.top {
            transition: all 0.6s ease-in-out;
            transform: translate(0, -40px) scale(0.7);
            opacity: 0;
        }

        .text-carousel.animate .line.middle {
            transition: all 0.6s ease-in-out;
            transform: translate(0, -20px) scale(0.7);
            opacity: 0.33;
        }

        .text-carousel.animate .line.bottom {
            transition: all 0.6s ease-in-out;
            transform: translate(0, 0) scale(1);
            opacity: 1;
        }

            /* The player is a light design; opt out of Chrome's auto-dark inversion so the page,

        /* HTML preloader: on screen from the first byte, until Room reports its first screen
           (room:ready). Same layout as the player's own Preloader.hx on the 1070x650 stage:
           the two brand gears large in the bottom-right corner, overflowing the stage edges,
           the loading text and a slim bar just above centre. Sizes/positions are stage
           percentages so it scales exactly like the player does. */
        #room-preloader { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: flex-start; justify-content: center; background: #f3f3f3; transition: opacity .35s ease; }
        #room-preloader.is-done { opacity: 0; pointer-events: none; }
        #room-preloader .rp-stage { position: relative; width: min(100vw, calc(100vh * 1070 / 650)); aspect-ratio: 1070 / 650; overflow: hidden; container-type: inline-size; background: #f3f3f3; }
        #room-preloader .rp-gear { position: absolute; display: block; transform-origin: 50% 50%; will-change: transform; }
        #room-preloader .rp-gear-big   { width: 35.05%; left: 52.57%; top: 72.77%; animation: rp-spin-cw 10s linear infinite; }
        #room-preloader .rp-gear-small { width: 25.51%; left: 79.77%; top: 55.92%; animation: rp-spin-ccw 6s linear infinite; }
        @keyframes rp-spin-cw  { to { transform: rotate(360deg); } }
        @keyframes rp-spin-ccw { to { transform: rotate(-360deg); } }
        /* Roboto Light for the loading text — the same file Lime preloads for the player, so it is
           cached by the time Room needs it. Arial has no light face; the fallbacks below do. */
        @font-face { font-family: "Roboto Preloader"; font-weight: 300; font-style: normal; font-display: swap; src: url("fonts/Roboto/Roboto-Light.ttf") format("truetype"); }
        #room-preloader .rp-text { position: absolute; left: 17.3%; width: 65.4%; top: 43.85%; text-align: center; color: #414141; font-weight: 300; font-size: 3.36cqw; line-height: 1.25; font-family: "Roboto Preloader", Roboto, "Helvetica Neue", "Segoe UI", system-ui, sans-serif; }
        #room-preloader .rp-bar { position: absolute; left: 42.15%; top: 52.77%; width: 15.7%; height: 2.15%; box-sizing: border-box; border: 0.14cqw solid #4d4d4d; border-radius: 999px; }
        #room-preloader .rp-bar > i { position: absolute; left: 0.37cqw; top: 0.28cqw; bottom: 0.28cqw; width: 0; max-width: calc(100% - 0.74cqw); border-radius: 999px; background: #4d4d4d; transition: width .3s ease; }
        @supports not (width: 1cqw) {

    <script>
    (function () {
        var el = document.getElementById('room-preloader');
        var text = document.getElementById('room-preloader-text');
        var bar = document.getElementById('room-preloader-bar');
        var done = false;
        function finish() {
            if (done || !el) return;
            done = true;
            el.className += ' is-done';
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
        }
        // Room (room.js) narrates its start-up with these window events.
        window.addEventListener('room:loading', function (e) {
            if (e.detail && e.detail.text) text.textContent = e.detail.text;
        });
        window.addEventListener('room:progress', function (e) {
            var d = e.detail || {};
            if (typeof d.value === 'number') bar.style.width = Math.max(0, Math.min(100, d.value * 100)) + '%';
            if (d.text) text.textContent = d.text;
        });
        window.addEventListener('room:ready', finish);
        // Safety nets: a player build without the events, or a start-up that
        // never reaches the first screen, must not leave the gears up forever.
        window.__roomPreloaderFinish = finish;
        setTimeout(finish, 120000);
    })();
    </script>

                    // The course's branding logo, as Room's menu shows it (paths are relative to the course root).
                    const logoNode = xmlDoc.querySelector('settings > menu_logo') || xmlDoc.querySelector('settings > logo');
                    const logoPath = logoNode ? logoNode.textContent.trim() : '';
                    if (logoPath) {

                screenfull.request();
                // Awoid locking orientation on unsuported Apple devices
                if (!(/iPhone|iPad|iPod/i.test(navigator.userAgent))) screen.orientation.lock("landscape");
            }
        }

        function closeThis()
        {
            if (window.screenfull && screenfull.isFullscreen) {
                screenfull.exit();
            }
            if (typeof closeRoom === "function") {
                closeRoom();
            }
        }


        function html5Actions() {
            var room,
                afterJsLoad = function () {
                    setTimeout(function () {
                        if (typeof lime !== "undefined") {
                            lime.embed('room', 'openfl-content', 1070, 650, { resizable: false, parameters: {} });
                            // Room is running: if it never reports room:ready (old build), drop the HTML preloader anyway.
                            setTimeout(function () { if (window.__roomPreloaderFinish) window.__roomPreloaderFinish(); }, 20000);
                        }
                    }, 500);
                };


            room = document.createElement("script");
            room.src = './room.js';
            document.body.appendChild(room);
            room.onload = function () {
                afterJsLoad();
            };
            window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
        }

        function getRestUrl() {
            var getUrl = top.window.location;
            return getUrl.protocol + "//" + getUrl.host + "/" + getUrl.pathname.split('/')[1] + '/api/index.php';
        }

        html5Actions(); // Default to HTML5
