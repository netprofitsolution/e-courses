<!DOCTYPE html>
<!-- The course podcast (course_audio.mp3) in a player page, opened by the
     player's headphones button. Same look as the Library's podcast promo
     (resources/views/website/audio-player.blade.php): the course title comes
     from imsmanifest.xml, the picture from the first screen's background. -->
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast</title>
    <style>
        html, body { margin: 0; height: 100%; background: #1d1d1f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; box-sizing: border-box; text-align: center; }
        img { width: min(320px, 60vw); aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; }
        img[hidden] { display: none; }
        h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        p { margin: 0; color: rgba(255,255,255,0.7); font-size: 0.9375rem; }
        audio { width: min(640px, 100%); }
    </style>
</head>
<body>
    <div class="wrap">
        <img id="cover" alt="" hidden>
        <h1 id="title"></h1>
        <p>The course as a podcast, generated by the Open eLMS Learning Generator.</p>
        <audio controls autoplay preload="metadata">
            <source src="course_audio.mp3" type="audio/mpeg">
        </audio>
    </div>
    <script>
        (function () {
            function xml(path) {
                return fetch(path, { cache: 'no-cache' })
                    .then(function (r) { return r.ok ? r.text() : ''; })
                    .then(function (t) { return new DOMParser().parseFromString(t, 'text/xml'); });
            }

            xml('imsmanifest.xml').then(function (doc) {
                var node = doc.querySelector('organization > title');
                var title = node ? node.textContent.trim() : '';
                if (title && title !== 'Empty_template') {
                    document.getElementById('title').textContent = title;
                    document.title = title + ' - Podcast';
                }
            }).catch(function () {});

            xml('xml/information.xml').then(function (doc) {
                var node = doc.querySelector('screen > Background');
                var src = node ? node.textContent.trim() : '';
                if (!src) return;
                var img = document.getElementById('cover');
                img.onload = function () { img.hidden = false; };
                img.src = src;
            }).catch(function () {});
        })();
    </script>
</body>
</html>
